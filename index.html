
<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AAX FIX SCAN TENA</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXX" crossorigin="anonymous"></script>
<style>
body{margin:0;background:#000;color:#fff;font-family:sans-serif;text-align:center;padding:8px}
.ad{background:#111;border:1px dashed #444;border-radius:10px;margin:8px 0;min-height:70px;display:flex;align-items:center;justify-content:center;font-size:11px;color:#666}
#box{border:3px solid #ffb700;border-radius:16px;overflow:hidden;position:relative;height:390px;background:#000}
video{width:100%;height:100%;object-fit:cover;position:absolute;top:0;left:0}
#focus{position:absolute;top:18%;left:5%;width:90%;height:60%;border:3px dashed #00ff6a;border-radius:12px;z-index:5}
#num{font-size:22px;background:#1a1a1a;padding:15px;border-radius:12px;border:2px solid #ffb700;color:#ffb700;font-weight:900;margin:10px 0;word-break:break-all}
#ok{font-weight:bold;min-height:20px;margin:5px 0}
.btn{width:100%;padding:16px;border:none;border-radius:12px;font-weight:900;font-size:17px;margin-top:8px}
#scan{background:#ffb700;color:#000}
#scan:disabled{background:#555;color:#999}
#dial{background:#00c853;color:#fff}
</style>
</head>
<body>
<div class="ad"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-XXXXXXXXXXXXXX" data-ad-slot="1111111111" data-ad-format="auto"></ins><script>(adsbygoogle=window.adsbygoogle||[]).push({});</script>ADS JUU</div>
<h1 style="color:#ffb700">AAX SCAN - FIX</h1>
<div id="box"><video id="v" autoplay playsinline muted></video><div id="focus"></div></div>
<button id="scan" class="btn">📷 SCAN VOCHA</button>
<div id="ok"></div>
<div id="num">*104* ---- #</div>
<button id="dial" class="btn">📞 PIGA *104#</button>
<div class="ad"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-XXXXXXXXXXXXXX" data-ad-slot="3333333333" data-ad-format="auto"></ins><script>(adsbygoogle=window.adsbygoogle||[]).push({});</script>ADS CHINI</div>
<canvas id="c" style="display:none"></canvas>
<script>
const v=document.getElementById('v'), c=document.getElementById('c'), ctx=c.getContext('2d'), ok=document.getElementById('ok'), numDiv=document.getElementById('num'), scanBtn=document.getElementById('scan');
let stream, worker=null, lastUSSD="", isScanning=false;
async function startCam(){
 try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment",width:{ideal:1920},height:{ideal:1080}}}); v.srcObject=stream; await v.play();}
 catch(e){ok.innerText="Ruhusu camera: "+e.message}
} startCam();
async function getWorker(){
 if(worker) return worker;
 worker=await Tesseract.createWorker('eng');
 await worker.setParameters({tessedit_char_whitelist:'0123456789', tessedit_pageseg_mode:'7'});
 return worker;
}
function getNum(t){
 let a=t.match(/\d{12,16}/g)||[];
 if(!a.length){let d=t.replace(/\D/g,''); return d.length>=12?d.slice(0,14):"";}
 let f=a.filter(n=>!n.startsWith("0325"));
 let cands=f.length?f:a;
 cands.sort((x,y)=>y.length-x.length);
 return cands[0].slice(0,14);
}
scanBtn.onclick=async()=>{
 if(isScanning) return;
 if(!stream){await startCam(); return;}
 isScanning=true; scanBtn.disabled=true; scanBtn.innerText="⏳ INASOMA...";
 ok.style.color="#ffb700"; ok.innerText="Inasoma..."; numDiv.innerText="*104* ---- #";
 try{
  const vw=v.videoWidth, vh=v.videoHeight;
  if(vw==0){throw new Error("Camera bado");}
  c.width=vw*0.9; c.height=vh*0.6;
  ctx.drawImage(v, vw*0.05, vh*0.15, vw*0.9, vh*0.6, 0,0, c.width, c.height);
  let d=ctx.getImageData(0,0,c.width,c.height);
  for(let i=0;i<d.data.length;i+=4){let g=0.299*d.data[i]+0.587*d.data[i+1]+0.114*d.data[i+2]; let vv=g>125?255:0; d.data[i]=d.data[i+1]=d.data[i+2]=vv;}
  ctx.putImageData(d,0,0);
  let tmp=document.createElement('canvas'); tmp.width=c.width*4; tmp.height=c.height*4;
  tmp.getContext('2d').drawImage(c,0,0,tmp.width,tmp.height);
  const w=await getWorker();
  const {data:{text}}=await w.recognize(tmp);
  let num=getNum(text);
  if(num && num.length>=12){
    lastUSSD="*104*"+num+"#"; numDiv.innerText=lastUSSD;
    ok.style.color="#00ff6a"; ok.innerText="✓ Sahihi: "+num+" - Weka nyingine sasa";
    try{await navigator.clipboard.writeText(lastUSSD);}catch{}
  }else{
    ok.style.color="#ff4444"; ok.innerText="Haijasoma - sogeza karibu na mwanga";
  }
 }catch(err){
  ok.style.color="#ff4444"; ok.innerText="Error: "+err.message+" - jaribu tena";
 }finally{
  isScanning=false; scanBtn.disabled=false; scanBtn.innerText="📷 SCAN VOCHA";
 }
};
document.getElementById('dial').onclick=()=>{
 if(!lastUSSD){ok.innerText="Scan kwanza"; return;}
 window.location.href="tel:"+encodeURIComponent(lastUSSD);
};
</script>
</body>
</html>
