<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AAX HAI-RUDII NAMB A MOJA</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.0.5/dist/tesseract.min.js"></script>
<style>
body{margin:0;background:#000;color:#fff;font-family:sans-serif;text-align:center;padding:10px}
#box{border:4px solid #ffb700;border-radius:16px;overflow:hidden;position:relative;height:480px;background:#111}
video{width:100%;height:100%;object-fit:cover;position:absolute;top:0;left:0}
#focus{position:absolute;top:22%;left:5%;width:90%;height:55%;border:3px dashed #00ff6a;border-radius:12px;z-index:5}
#num{font-size:26px;background:#111;padding:16px;border-radius:12px;border:2px solid #ffb700;color:#ffb700;font-weight:900;margin:12px 0;word-break:break-all}
#ok{font-weight:bold;min-height:22px;margin:6px 0}
.btn{width:100%;padding:18px;border:none;border-radius:12px;font-weight:900;font-size:18px;margin-top:8px}
#scan{background:#ffb700;color:#000}
#scan:disabled{background:#555}
#dial{background:#00c853;color:#fff}
#clear{background:#333;color:#fff}
</style>
</head>
<body>
<h2 style="color:#ffb700">AAX SCAN - KILA VOCHA MPYA</h2>
<div id="box"><video id="v" autoplay playsinline muted></video><div id="focus"></div></div>
<button id="scan" class="btn">📷 SCAN VOCHA MPYA</button>
<div id="ok">Weka vocha mpya kila mara</div>
<div id="num">*104* ---- #</div>
<button id="dial" class="btn">📞 PIGA *104#</button>
<button id="clear" class="btn">🗑️ FUTA ILI USCAN NYINGINE</button>
<canvas id="c" style="display:none"></canvas>
<script>
const v=document.getElementById('v'), c=document.getElementById('c'), ok=document.getElementById('ok'), numDiv=document.getElementById('num'), scanBtn=document.getElementById('scan');
let stream=null, worker=null, lastUSSD="", ready=false;

async function start(){
 stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment", width:{ideal:1280}}});
 v.srcObject=stream; await new Promise(r=> v.onloadedmetadata=r); await v.play();
 worker=await Tesseract.createWorker('eng'); await worker.setParameters({tessedit_char_whitelist:'0123456789'});
 ready=true; ok.style.color="#00ff6a"; ok.innerText="✓ Tayari";
}
start();

function extractFresh(text){
  // Anza upya kila wakati - hakuna kumbukumbu
  let raw=text.replace(/[^0-9]/g,' ');
  let tokens=raw.split(/\s+/).filter(s=>s.length>=4);
  let all=tokens.join('');
  // Ondoa SN yote 0325...
  all=all.replace(/03250500\d+/g,'').replace(/0325\d+/g,'');
  let match=all.match(/9\d{12,13}/) || all.match(/96537\d{9}/) || all.match(/\d{12,14}/);
  return match?match[0].slice(0,14):"";
}

scanBtn.onclick=async()=>{
 if(!ready) return;
 scanBtn.disabled=true; lastUSSD=""; numDiv.innerText="*104* ---- #"; // FUTA YA ZAMANI KABLA YA SCAN MPYA
 ok.style.color="#ffb700"; ok.innerText="Inasoma vocha mpya...";
 try{
  const vw=v.videoWidth, vh=v.videoHeight;
  c.width=vw*0.9; c.height=vh*0.55;
  let ctx=c.getContext('2d');
  ctx.clearRect(0,0,c.width,c.height); // SAFISHA CANVAS
  ctx.drawImage(v, vw*0.05, vh*0.22, vw*0.9, vh*0.55, 0,0, c.width, c.height);
  let big=document.createElement('canvas'); big.width=c.width*3; big.height=c.height*3;
  big.getContext('2d').drawImage(c,0,0,big.width,big.height);
  let {data:{text}}=await worker.recognize(big);
  let num=extractFresh(text); // CHUKUA MPYA KILA WAKATI
  if(num.length>=12){
    lastUSSD="*104*"+num+"#"; numDiv.innerText=lastUSSD;
    ok.style.color="#00ff6a"; ok.innerText="✓ Mpya: "+num;
  }else{ok.style.color="#ff4444"; ok.innerText="Haijasoma - weka tena";}
 }catch(e){ok.innerText="Error: "+e.message;}
 scanBtn.disabled=false; scanBtn.innerText="📷 SCAN VOCHA MPYA";
};

document.getElementById('dial').onclick=()=>{if(!lastUSSD){ok.innerText="Scan kwanza"; return;} window.location.href="tel:"+encodeURIComponent(lastUSSD);};
document.getElementById('clear').onclick=()=>{lastUSSD=""; numDiv.innerText="*104* ---- #"; ok.innerText="Futa - weka vocha mpya sasa"; scanBtn.innerText="📷 SCAN VOCHA MPYA";};
</script>
</body>
</html>
