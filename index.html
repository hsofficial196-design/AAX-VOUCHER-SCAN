<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AAX VOCHA - FAST SCAN</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#000;color:#fff;font-family:Arial;padding:12px}
h1{text-align:center;color:#ffaa00}
.box{background:#111;border-radius:14px;padding:12px;margin:10px 0}
.btn{width:100%;padding:14px;border:none;border-radius:10px;font-weight:bold;margin:5px 0}
.btn-y{background:#ffaa00;color:#000}.btn-g{background:#00d166;color:#fff}.btn-b{background:#00aaff;color:#fff}
video{width:100%;border-radius:12px;height:38vh;object-fit:cover;background:#000;border:2px solid #ffaa00}
input{width:100%;padding:14px;border-radius:10px;border:none;background:#222;color:#fff;text-align:center;font-size:22px;letter-spacing:4px}
.stat{display:flex;justify-content:space-between;padding:10px;background:#1a1a1a;border-radius:8px;margin:5px 0}
.copy{background:#00d166;color:#000;padding:8px;border-radius:6px;text-align:center;font-weight:bold;display:none;margin-top:6px}
</style>
</head>
<body>
<h1>AAX VOCHA FAST</h1>

<div class="box">
<video id="video" autoplay playsinline muted></video>
<canvas id="canvas" style="display:none"></canvas>
<button class="btn btn-y" onclick="fastScan()">📸 SCAN HARAKA (1 sec)</button>
<p id="scanInfo" style="text-align:center">Elekeza namba katikati</p>
</div>

<div class="box">
<input type="file" id="img" accept="image/*" onchange="scanImage(this)" style="display:none">
<button class="btn btn-b" onclick="document.getElementById('img').click()">🖼️ CHAGUA PICHA</button>
<div id="imgInfo" style="text-align:center;color:#888;font-size:13px"></div>
</div>

<div class="box">
<input id="vochaNum" placeholder="Namba hapa" maxlength="16">
<div id="copyBox" class="copy"></div>
<div style="display:flex;gap:6px">
<button class="btn btn-g" style="flex:1" onclick="checkAndCopy()">COPY & THIBITISHA</button>
<button class="btn" style="flex:1;background:#333;color:#fff" onclick="vochaNum.value=''">FUTA</button>
</div>
<div id="result"></div>
</div>

<div class="box">
<div id="history">Hakuna</div>
</div>

<script>
let hist=JSON.parse(localStorage.getItem('aax_vocha')||'[]');
const video=document.getElementById('video');
const canvas=document.getElementById('canvas');
navigator.mediaDevices.getUserMedia({video:{facingMode:"environment", width:{ideal:640}, height:{ideal:480}}}).then(s=>video.srcObject=s).catch(()=>{document.getElementById('scanInfo').innerText='Ruhusu Camera'});

function showCopy(n){
 let b=document.getElementById('copyBox');
 b.innerText=`✅ ${n} IMEKOPIWA - Nenda PASTE`;
 b.style.display='block';
 navigator.clipboard.writeText(n);
 if(navigator.vibrate) navigator.vibrate(100);
 setTimeout(()=>b.style.display='none',3000);
}

// SCAN YA HARAKA - SEKUNDE 1 TU
async function fastScan(){
 document.getElementById('scanInfo').innerText='⏳ Inasoma...';
 canvas.width=video.videoWidth;
 canvas.height=video.videoHeight;
 let ctx=canvas.getContext('2d');
 // Kata katikati tu - haraka zaidi
 let w=canvas.width*0.9, h=canvas.height*0.25;
 let x=canvas.width*0.05, y=canvas.height*0.35;
 ctx.drawImage(video,0,0);
 let crop=ctx.getImageData(x,y,w,h);
 canvas.width=w; canvas.height=h;
 ctx.putImageData(crop,0,0);

 try{
  const {data:{text}}=await Tesseract.recognize(canvas,'eng',{tessedit_char_whitelist:'0123456789', tessedit_pageseg_mode:'7'});
  let m=text.match(/\d{10,16}/g);
  if(m){
   let best=m.sort((a,b)=>b.length-a.length)[0];
   document.getElementById('vochaNum').value=best;
   showCopy(best);
   document.getElementById('scanInfo').innerHTML=`<b style="color:#00d166">✓ ${best} - IMEKOPIWA</b>`;
   checkAndCopy();
  }else{
   document.getElementById('scanInfo').innerText='❌ Sogeza karibu zaidi, jaribu tena';
  }
 }catch(e){
  document.getElementById('scanInfo').innerText='Jaribu tena';
 }
}

async function scanImage(input){
 let file=input.files[0]; if(!file) return;
 document.getElementById('imgInfo').innerText='Inasoma...';
 const {data:{text}}=await Tesseract.recognize(file,'eng',{tessedit_char_whitelist:'0123456789'});
 let m=text.match(/\d{10,16}/g);
 if(m){
  let best=m.sort((a,b)=>b.length-a.length)[0];
  document.getElementById('vochaNum').value=best;
  showCopy(best);
  document.getElementById('imgInfo').innerHTML=`<b style="color:#00d166">${best} - IMEKOPIWA</b>`;
  checkAndCopy();
 }else document.getElementById('imgInfo').innerText='Hakuna namba';
}

function checkAndCopy(){
 let num=document.getElementById('vochaNum').value.replace(/\D/g,'');
 if(num.length<10) return;
 showCopy(num);
 let r=document.getElementById('result');
 r.innerHTML=`<div class="stat"><span>${num}</span><span style="color:#00d166">IMEKOPIWA</span></div><button class="btn btn-g" onclick="window.location.href='tel:*104*${num}%23'">PAKIA *104*${num}#</button>`;
 if(!hist.find(h=>h==num)){hist.unshift(num); localStorage.setItem('aax_vocha',JSON.stringify(hist)); render();}
}
function render(){
 let h=document.getElementById('history');
 if(hist.length==0){h.innerHTML='Hakuna';return}
 h.innerHTML=hist.map(n=>`<div class="stat" onclick="document.getElementById('vochaNum').value='${n}';showCopy('${n}')"><span>${n}</span><span>gusa ku-copy</span></div>`).join('');
}
render();
</script>
</body>
</html>
