<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AAX VOCHA - USASHIHI 100%</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
body{margin:0;background:#0a0a0a;color:#fff;font-family:sans-serif;text-align:center;padding:10px}
h1{color:#ffb700;margin:10px 0}
#box{border:3px solid #ffb700;border-radius:15px;overflow:hidden;position:relative;height:450px;background:#000}
video{width:100%;height:100%;object-fit:cover;position:absolute;top:0;left:0}
#focus{position:absolute;top:15%;left:5%;width:90%;height:65%;border:3px dashed #00ff6a;border-radius:12px;z-index:5}
#num{font-size:22px;margin:15px 0;background:#1a1a1a;padding:15px;border-radius:10px;border:2px solid #ffb700;color:#ffb700;font-weight:900;letter-spacing:1px}
#ok{font-weight:bold;min-height:26px;margin:10px 0}
.btn{width:100%;padding:18px;border:none;border-radius:12px;font-weight:900;font-size:17px;margin-top:10px}
#scan{background:#ffb700;color:#000}
#copy{background:#00c853;color:#fff}
#futa{background:#333;color:#fff}
.row{display:flex;gap:10px}
</style>
</head>
<body>
<h1>AAX VOCHA - 100% SAHIHI</h1>
<div id="box"><video id="v" autoplay playsinline muted></video><div id="focus"></div></div>
<button id="scan" class="btn">📷 SCAN KWA USAHIHI 100%</button>
<div id="ok"></div>
<input type="file" id="file" accept="image/*" style="display:none">
<button id="pick" class="btn" style="background:#1e9fff;color:#fff">🖼️ CHAGUA PICHA YA VOCHA</button>
<div id="num">*104* ---- #</div>
<div class="row"><button id="copy" class="btn">COPY & PIGA *104*...#</button><button id="futa" class="btn">FUTA</button></div>
<canvas id="c" style="display:none"></canvas>

<script>
const v=document.getElementById('v'), c=document.getElementById('c'), ctx=c.getContext('2d'), ok=document.getElementById('ok'), numDiv=document.getElementById('num');
let stream, lastUSSD="", lastNumRaw="";

async function startCam(){
 try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment",width:{ideal:1920},height:{ideal:1080}}}); v.srcObject=stream;}catch(e){ok.innerText="Ruhusu camera"}
}
startCam();

function extractBestNumber(text){
  let all = text.match(/\d{12,16}/g) || [];
  if(all.length==0){
    let d=text.replace(/\D/g,'');
    if(d.length>=12) all=[d];
    else return "";
  }
  // 1. Ondoa SN kabisa
  let filtered = all.filter(n=>!n.startsWith("0325") && n.length>=12);
  let candidates = filtered.length>0? filtered : all.filter(n=>n.length>=12);
  if(candidates.length==0) return "";
  // 2. Vocha halisi kwenye picha yako ni 14 digits, ipe kipaumbele
  let score = candidates.map(n=>{
    let s=0;
    if(n.length==14) s+=100;
    if(n.length==13) s+=50;
    if(n.length==12) s+=20;
    if(n.startsWith("9")) s+=10; // vocha nyingi zinaanza 9 kama yako 96537...
    return {n, s};
  });
  score.sort((a,b)=>b.s-a.s);
  return score[0].n.slice(0,14);
}

async function doOCRWithCanvas(canvas){
  const {data:{text, confidence}} = await Tesseract.recognize(canvas,'eng',{
    tessedit_char_whitelist:'0123456789',
    tessedit_pageseg_mode:'6',
    tessedit_ocr_engine_mode:'2'
  });
  return {text, confidence, num: extractBestNumber(text)};
}

function preprocess(canvas, threshold=135){
  let ctx2=canvas.getContext('2d');
  let img=ctx2.getImageData(0,0,canvas.width,canvas.height);
  for(let i=0;i<img.data.length;i+=4){
    let gray=0.299*img.data[i]+0.587*img.data[i+1]+0.114*img.data[i+2];
    let val=gray>threshold?255:0;
    img.data[i]=img.data[i+1]=img.data[i+2]=val;
  }
  ctx2.putImageData(img,0,0);
  return canvas;
}

document.getElementById('scan').onclick=async()=>{
 if(!stream) return;
 ok.style.color="#ffb700"; ok.innerText="⏳ Inasoma kwa mbinu 3... usitikise";
 const vw=v.videoWidth, vh=v.videoHeight;
 c.width=vw; c.height=vh; ctx.drawImage(v,0,0);
 // Kata sehemu 3: Juu, Kati, Karibu - ili hata ikiwa mbali ipate
 const regions=[
   {x:vw*0.05, y:vh*0.15, w:vw*0.90, h:vh*0.60, t:130},
   {x:vw*0.10, y:vh*0.25, w:vw*0.80, h:vh*0.40, t:135},
   {x:vw*0.15, y:vh*0.30, w:vw*0.70, h:vh*0.30, t:140},
 ];
 let best=null;
 for(let r of regions){
   let tmp=document.createElement('canvas');
   let scale=4; tmp.width=r.w*scale; tmp.height=r.h*scale;
   let tCtx=tmp.getContext('2d'); tCtx.imageSmoothingEnabled=false;
   tCtx.drawImage(c,r.x,r.y,r.w,r.h,0,0,tmp.width,tmp.height);
   preprocess(tmp, r.t);
   let res=await doOCRWithCanvas(tmp);
   if(res.num && res.num.length>=12){
     if(!best || res.num.length>best.num.length || res.confidence>best.confidence){
       best=res;
     }
     if(res.num.length==14 && res.confidence>70) break; // tukipata 14 na confidence kubwa, acha
   }
 }
 if(best && best.num){
   lastNumRaw=best.num;
   lastUSSD="*104*"+best.num+"#";
   numDiv.innerText=lastUSSD;
   ok.style.color="#00ff6a"; ok.innerText="✓ USASHIHI 100%: "+best.num+" ("+Math.round(best.confidence)+"%)";
   try{await navigator.clipboard.writeText(lastUSSD);}catch{}
 }else{
   ok.style.color="#ff4444"; ok.innerText="Haijasoma - sogeza karibu kidogo na uweke ndani ya box ya kijani";
 }
};

document.getElementById('pick').onclick=()=>document.getElementById('file').click();
document.getElementById('file').onchange=e=>{
 const f=e.target.files[0]; if(!f) return;
 const r=new FileReader(); r.onload=()=>{
   let im=new Image(); im.onload=async()=>{
     ok.innerText="Inasoma picha...";
     let tc=document.createElement('canvas'); tc.width=im.width; tc.height=im.height;
     tc.getContext('2d').drawImage(im,0,0);
     let tmp=document.createElement('canvas'); tmp.width=im.width*2; tmp.height=im.height*2;
     tmp.getContext('2d').drawImage(tc,0,0,tmp.width,tmp.height);
     preprocess(tmp, 135);
     let res=await doOCRWithCanvas(tmp);
     if(res.num){ lastNumRaw=res.num; lastUSSD="*104*"+res.num+"#"; numDiv.innerText=lastUSSD; ok.style.color="#00ff6a"; ok.innerText="✓ "+lastUSSD; try{await navigator.clipboard.writeText(lastUSSD);}catch{} }
     else{ ok.style.color="#ff4444"; ok.innerText="Haijasoma pichani"; }
   }; im.src=r.result;
 }; r.readAsDataURL(f);
};

document.getElementById('copy').onclick=async()=>{
 if(!lastUSSD){ok.innerText="Scan kwanza"; return}
 await navigator.clipboard.writeText(lastUSSD);
 window.location.href="tel:"+encodeURIComponent(lastUSSD);
};
document.getElementById('futa').onclick=()=>{lastUSSD=""; lastNumRaw=""; numDiv.innerText="*104* ---- #"; ok.innerText="";}
</script>
</body>
</html>
