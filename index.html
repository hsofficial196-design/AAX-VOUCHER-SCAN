<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AAX VOCHA FAST</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{background:#000;color:#fff;font-family:sans-serif;padding:10px}
h1{color:#ffb700;text-align:center;font-size:32px;font-weight:900;margin:10px 0}
.card{background:#0f0f0f;border-radius:18px;padding:12px;margin-bottom:14px;border:1px solid #222}
#box{border:3px solid #ffb700;border-radius:16px;height:400px;position:relative;overflow:hidden;background:#0a2a12;display:flex;align-items:center;justify-content:center}
#box video,#box img{width:100%;height:100%;object-fit:cover}
#ok{color:#00ff6a;text-align:center;font-weight:900;margin:10px 0;display:none}
.btn{width:100%;padding:16px;border:none;border-radius:14px;font-weight:900;font-size:16px}
#scan{background:#ffb700;color:#000}#pick{background:#2196F3;color:#fff}
#num{background:#1a1a1a;border-radius:14px;padding:18px;text-align:center;font-size:22px;font-weight:900;color:#ffb700;border:2px solid #ffb700;word-break:break-all;margin-bottom:10px}
.row{display:flex;gap:10px}#copy{background:#00c853;color:#fff;flex:1.6}#futa{background:#2a2a2a;color:#fff;flex:1}
</style>
</head>
<body>
<h1>AAX VOCHA FAST</h1>
<div class="card">
<div id="box"><video id="v" autoplay playsinline muted></video><img id="img" style="display:none"></div>
<button id="scan" class="btn" style="margin-top:12px">📷 SCAN HARAKA (1 sec)</button>
<div id="ok">✓ <span id="okNum"></span> - IMEKOPIWA</div>
</div>
<div class="card"><button id="pick" class="btn">🖼️ CHAGUA PICHA</button></div>
<div class="card">
<div id="num">*104* ---- #</div>
<div class="row"><button id="copy" class="btn">COPY & THIBITISHA</button><button id="futa" class="btn">FUTA</button></div>
</div>
<input type="file" id="file" accept="image/*" style="display:none"><canvas id="c" style="display:none"></canvas>
<script>
const v=document.getElementById('v'), img=document.getElementById('img'), file=document.getElementById('file'), c=document.getElementById('c'), ok=document.getElementById('ok'), okNum=document.getElementById('okNum'), numDiv=document.getElementById('num');
let worker, last="", lastUSSD="";
async function init(){let s=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});v.srcObject=s;await v.play();worker=await Tesseract.createWorker('eng');await worker.setParameters({tessedit_char_whitelist:'0123456789'});}init();
function getVocha(t){let all=t.replace(/[^0-9]/g,' ');all=all.replace(/0325\d+/g,' ');let m=all.match(/3\d{13}/)||all.match(/\d{14}/)||all.match(/\d{12,13}/);return m?m[0].slice(0,14):"";}
async function scan(src){numDiv.innerText="INASOMA...";let {data:{text}}=await worker.recognize(src);let n=getVocha(text);if(n){last=n;lastUSSD="*104*"+n+"#";numDiv.innerText=lastUSSD;okNum.innerText=n;ok.style.display="block";try{await navigator.clipboard.writeText(lastUSSD);}catch{} }else{numDiv.innerText="HAIKUSOMA";}}
document.getElementById('scan').onclick=()=>{c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);scan(c);};
document.getElementById('pick').onclick=()=>file.click();
file.onchange=e=>{let f=e.target.files[0];let u=URL.createObjectURL(f);img.src=u;img.style.display="block";v.style.display="none";img.onload=()=>scan(img);};
document.getElementById('copy').onclick=()=>{if(!lastUSSD)return;window.location.href="tel:"+encodeURIComponent(lastUSSD);};
document.getElementById('futa').onclick=()=>{last="";lastUSSD="";numDiv.innerText="*104* ---- #";ok.style.display="none";img.style.display="none";v.style.display="block";};
</script>
</body>
</html>
